services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clicars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clicars_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clicars_search}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clicars} -d ${POSTGRES_DB:-clicars_search}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-clicars}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clicars_pass}
      DB_NAME: ${POSTGRES_DB:-clicars_search}
      GOOGLEMAPS_BROWSER_POOL: ${GOOGLEMAPS_BROWSER_POOL:-2}
      GOOGLEMAPS_CONCURRENCY: ${GOOGLEMAPS_CONCURRENCY:-4}
      GOOGLEMAPS_SCROLL_TIMEOUT: ${GOOGLEMAPS_SCROLL_TIMEOUT:-30s}
      CAMPAIGN_MIN_DELAY: ${CAMPAIGN_MIN_DELAY:-90s}
      CAMPAIGN_MAX_DELAY: ${CAMPAIGN_MAX_DELAY:-4m}
      CAMPAIGN_RATE_PER_HOUR: ${CAMPAIGN_RATE_PER_HOUR:-20}
      CAMPAIGN_MAX_WORKERS: ${CAMPAIGN_MAX_WORKERS:-5}
      PROTECT_TIMEZONE: ${PROTECT_TIMEZONE:-America/Sao_Paulo}
      PROTECT_START_HOUR: ${PROTECT_START_HOUR:-8}
      PROTECT_END_HOUR: ${PROTECT_END_HOUR:-20}
      PROTECT_LUNCH_PAUSE: ${PROTECT_LUNCH_PAUSE:-on}
      PROTECT_DAILY_TARGET: ${PROTECT_DAILY_TARGET:-200}
      PROTECT_MIN_DELAY: ${PROTECT_MIN_DELAY:-90s}
      PROTECT_MAX_DELAY: ${PROTECT_MAX_DELAY:-4m}
      PROTECT_REST_EVERY: ${PROTECT_REST_EVERY:-10}
      PROTECT_REST_MIN: ${PROTECT_REST_MIN:-4m}
      PROTECT_REST_MAX: ${PROTECT_REST_MAX:-12m}
      WARMUP_INTERVAL: ${WARMUP_INTERVAL:-8m}
      WARMUP_TICK: ${WARMUP_TICK:-3m}
      WARMUP_PRIMARY_PHONES: ${WARMUP_PRIMARY_PHONES:-554184376916}
      WARMUP_MATURE_PHONES: ${WARMUP_MATURE_PHONES:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://whatsapp.zennitex.com.br/api}
      WHATSAPP_ADMIN_KEY: ${WHATSAPP_ADMIN_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 2 browsers × ~400 MB + Go runtime + margem de segurança
          memory: 1536m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
