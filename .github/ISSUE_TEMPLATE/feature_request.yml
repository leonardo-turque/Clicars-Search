name: Feature request
description: Suggest an enhancement for Clicars Search
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / Google Maps scraper
        - WhatsApp / campaigns
        - Frontend dashboard
        - API / backend
        - DevOps / Docker
        - Docs
    validations:
      required: true
